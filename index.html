<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGY Funded</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        /* الشريط العلوي */
        .navbar {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
        }

        /* خلفية الـ Trading Chart المتحركة */
        #chartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.35;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">
            📈 EGY Funded
        </div>
    </div>

    <!-- كانفاس الخلفية المتحركة -->
    <canvas id="chartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // إنشاء أسهم وخطوط التداول المتحركة
        const arrows = [];
        const numArrows = 25;

        for (let i = 0; i < numArrows; i++) {
            arrows.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 80 + 40,
                speed: Math.random() * 1.5 + 0.5,
                angle: -Math.PI / 4, // اتجاه السهم للأعلى واليمين (صعود التداول)
                color: Math.random() > 0.4 ? '#00ff88' : '#ff3366'
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم شبكة خلفية (Grid)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // تحريك ورسم الأسهم والـ Flow lines
            arrows.forEach(arrow => {
                ctx.strokeStyle = arrow.color;
                ctx.fillStyle = arrow.color;
                ctx.lineWidth = 2;

                const endX = arrow.x + Math.cos(arrow.angle) * arrow.length;
                const endY = arrow.y + Math.sin(arrow.angle) * arrow.length;

                // رسم خط السهم
                ctx.beginPath();
                ctx.moveTo(arrow.x, arrow.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // رسم رأس السهم
                const headlen = 8;
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - headlen * Math.cos(arrow.angle - Math.PI / 6), endY - headlen * Math.sin(arrow.angle - Math.PI / 6));
                ctx.lineTo(endX - headlen * Math.cos(arrow.angle + Math.PI / 6), endY - headlen * Math.sin(arrow.angle + Math.PI / 6));
                ctx.fill();

                // تحريك السهم
                arrow.x += Math.cos(arrow.angle) * arrow.speed;
                arrow.y += Math.sin(arrow.angle) * arrow.speed;

                // إعادتهم للشاشة عند الخروج
                if (arrow.x > canvas.width || arrow.y < 0) {
                    arrow.x = Math.random() * canvas.width - 200;
                    arrow.y = canvas.height + 50;
                }
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>

</body>
</html>
